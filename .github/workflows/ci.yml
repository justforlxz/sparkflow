name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: lint / typecheck / 单测 / 构建
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      # 构建不依赖数据库：所有页面与接口都是动态渲染。
      - run: pnpm build

  e2e:
    name: 集成测试 / 端到端验收
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: sparkflow
          POSTGRES_PASSWORD: sparkflow
          POSTGRES_DB: sparkflow
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sparkflow -d sparkflow"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgresql://sparkflow:sparkflow@127.0.0.1:5432/sparkflow
      AUTH_SECRET: ci-only-secret-ci-only-secret-000000
      GENERATION_ADAPTER: mock
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:deploy
      - run: pnpm test:integration
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7
